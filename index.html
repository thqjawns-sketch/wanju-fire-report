<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>완주소방서 화재상황보고 V1</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#111}header{padding:18px;background:#fff;border-bottom:1px solid #ddd}main{max-width:800px;margin:auto;padding:12px}.card{background:#fff;margin:12px 0;padding:16px;border-radius:14px}h1{font-size:21px;margin:0}h2{font-size:17px}label{display:block;font-size:13px;font-weight:700;margin-top:10px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:4px;border:1px solid #bbb;border-radius:9px;font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fixed{background:#eee}.btn{padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:10px}.primary{background:#b91c1c;color:#fff}.preview{white-space:pre-wrap;line-height:1.7;border:1px dashed #aaa;padding:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🔥 완주소방서 화재상황보고 V1</h1><small>현장 입력 → 자동작성 → 본부 보고서</small></header><main><div class="card"><h2>기본정보</h2><div class="grid"><label>수신<input class="fixed" value="전북특별도지사" readonly></label><label>참조<input class="fixed" value="119종합상황실장" readonly></label><label>발신<input class="fixed" value="완주소방서장" readonly></label><label>발신지<input class="fixed" value="완주소방서 현장대응단" readonly></label><label>작성자<input id="writer"></label><label>보고책임자<input id="boss"></label><label>접수시간<input id="recv" type="time" step="1"></label></div></div><div class="card"><h2>1. 발생개요</h2><div class="grid"><label>발생일<input id="date" type="date"></label><label>종료상태<select id="status"><option>화재완진</option><option>자체진화</option><option>화재진압 중</option></select></label><label>종료시간<input id="end" type="time"></label><label>읍·면<select id="town"><option>삼례읍</option><option>봉동읍</option><option>용진읍</option><option>상관면</option><option>이서면</option><option>소양면</option><option>구이면</option><option>고산면</option><option>비봉면</option><option>운주면</option><option>화산면</option><option>동상면</option><option>경천면</option></select></label><label>리<input id="ri" placeholder="예: 하리"></label><label>지번<input id="jibun" placeholder="예: 1290-448"></label><label>도로명주소<input id="road" placeholder="없으면 비움"></label><label>대상<input id="target"></label><label>선착대<select id="first"><option>봉동119안전센터</option><option>소양지역대</option><option>삼례119안전센터</option><option>고산119안전센터</option><option>운주지역대</option><option>화산지역대</option><option>혁신119안전센터</option><option>구이119안전센터</option><option>상관지역대</option></select></label><label>선착대 거리 km<input id="firstKm" type="number" step=".1"></label><label>본서 거리 km<input id="hqKm" type="number" step=".1"></label><label>원인<input id="cause" value="조사 중"></label></div><label>구조<input id="structure"></label></div><div class="card"><h2>2. 사고개요</h2><label>현장 원문 메모<textarea id="raw"></textarea></label><button class="btn" onclick="alert('Google Apps Script 연결 후 ChatGPT 기능을 활성화합니다.')">✨ ChatGPT 정리</button><label>보고서 적용 문장<textarea id="summary"></textarea></label></div><div class="card"><h2>3. 피해상황</h2><div class="grid"><label>인명피해<select id="human"><option>피해 없음</option><option>있음</option></select></label><label>인명피해 상세<input id="humanDetail"></label><label>부동산 피해(천원)<input id="real" type="number" value="0"></label><label>동산 피해(천원)<input id="move" type="number" value="0"></label></div><label>피해내용<textarea id="damageDetail"></textarea></label></div><div class="card"><h2>4. 동원상황</h2><div class="grid"><label>소방 명<input id="pFire" type="number" value="0"></label><label>경찰 명<input id="pPolice" type="number" value="0"></label><label>유관기관 명<input id="pAgency" type="number" value="0"></label><label>의소대 명<input id="pVolunteer" type="number" value="0"></label><label>장비 총계 대<input id="vehicleN" type="number" value="0"></label></div><label>장비 세부<input id="vehicles" placeholder="지휘 1, 펌프 5, 물탱크 5, 구급 2 ..."></label></div><div class="card"><h2>5. 조치사항</h2><textarea id="actions" placeholder="12:35:59 신고접수 및 출동지령&#10;12:42 선착대 현장도착&#10;12:52 초진&#10;13:07 완진"></textarea></div><div class="card"><h2>6. 그 밖의 사항</h2><label>보험<select id="insurance"><option>미가입</option><option>가입</option></select></label><label>특이사항<textarea id="special"></textarea></label></div><div class="card"><button class="btn" onclick="saveLocal()">임시저장</button> <button class="btn primary" onclick="render()">보고서 미리보기</button></div><div class="card"><h2>보고서 미리보기</h2><div id="preview" class="preview">입력 후 보고서 미리보기를 누르세요.</div></div></main><script>const $=x=>document.getElementById(x),v=x=>$(x).value||'',n=x=>Number(v(x)||0);$('date').value=new Date().toISOString().slice(0,10);function address(){return v('road')?`완주군 ${v('town')} ${v('road')}(${v('ri')} ${v('jibun')})`:`완주군 ${v('town')} ${v('ri')} ${v('jibun')}`}function render(){let total=n('real')+n('move'),people=n('pFire')+n('pPolice')+n('pAgency')+n('pVolunteer');$('preview').textContent=`완주군 ${v('town')} ${v('ri')} ${v('target')} 화재\n\n수신: 전북특별도지사 / 참조: 119종합상황실장\n발신: 완주소방서장 / 발신지: 완주소방서 현장대응단\n작성자: ${v('writer')} / 보고책임자: ${v('boss')} / 접수시간: ${v('recv')}\n\n1. 발생개요\n 가. 일시: ${v('date')} ${v('recv')}(접수) ~ ${v('end')}(${v('status')})\n   ※ 선착대 ${v('first')} ${v('firstKm')}km, 본서 ${v('hqKm')}km\n 나. 장소: ${address()}\n 다. 구조: ${v('structure')}\n 라. 대상: ${v('target')}\n 마. 원인: ${v('cause')}\n 바. 사고개요: ${v('summary')}\n\n2. 피해상황\n 가. 인명피해: ${v('human')} ${v('humanDetail')}\n 나. 재산피해: ${total.toLocaleString()}천원(부동산 ${n('real').toLocaleString()}천원, 동산 ${n('move').toLocaleString()}천원)\n ${v('damageDetail')}\n\n3. 동원상황\n 가. 인원: ${people}명(소방 ${n('pFire')}, 경찰 ${n('pPolice')}, 유관기관 ${n('pAgency')}, 의소대 ${n('pVolunteer')})\n 나. 장비: ${n('vehicleN')}대(${v('vehicles')})\n\n4. 조치사항\n${v('actions')}\n\n5. 그 밖의 사항\n ○ 보험가입: ${v('insurance')}\n ○ 특이사항: ${v('special')||'없음'}`};function saveLocal(){let d={};document.querySelectorAll('[id]').forEach(e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.tagName))d[e.id]=e.value});localStorage.setItem('wanjuFireReportV1',JSON.stringify(d));alert('현재 기기에 임시저장했습니다. 다음 단계에서 Google Sheet 저장을 연결합니다.')}let s=localStorage.getItem('wanjuFireReportV1');if(s)try{let d=JSON.parse(s);Object.entries(d).forEach(([k,x])=>{if($(k))$(k).value=x})}catch(e){}</script></body></html>
