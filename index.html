<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>완주소방서 화재상황보고 V2.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:16px}h1{font-size:21px;margin:0}main{max-width:860px;margin:auto;padding:12px}.card{background:#fff;margin:12px 0;padding:16px;border-radius:14px}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}label{display:block;font-size:13px;font-weight:800;margin-top:9px}input,select,textarea{width:100%;padding:11px;margin-top:4px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:#6b7280;margin-top:6px;line-height:1.5}.choices,.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.choice,.btn{border:0;border-radius:10px;padding:10px 11px;font-weight:800;cursor:pointer}.choice{border:1px solid #c7cdd4;background:#fff}.choice.on{background:#111827;color:#fff}.btn{margin-top:7px}.red{background:#b91c1c;color:#fff}.green{background:#166534;color:#fff}.blue{background:#eef2ff;color:#1e3a8a}.gray{background:#f3f4f6}.readonly{background:#f8fafc}.box{display:none;margin-top:8px;padding:9px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px}.box.show{display:block}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.key{height:46px;border:1px solid #c7cdd4;background:#fff;border-radius:10px;font-size:17px;font-weight:900}.wide{grid-column:span 2}.done{background:#111827;color:#fff}.danger{background:#fff1f2;color:#be123c}.step{display:grid;grid-template-columns:1fr 54px 54px;gap:6px}.step button{border:1px solid #bbb;background:#fff;border-radius:9px;font-size:18px;font-weight:900}.core{border:2px solid #fecaca}.badge{float:right;background:#fee2e2;color:#991b1b;font-size:12px;padding:5px 8px;border-radius:999px}.draft{background:#fffdf5;border-color:#facc15}.final{background:#f0fdf4;border-color:#86efac}.preview{white-space:pre-wrap;line-height:1.7;border:1px dashed #aaa;padding:14px;border-radius:10px}.status{font-size:13px;font-weight:800;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>🔥 완주소방서 화재상황보고 V2.3</h1><small>현장 클릭 입력 중심 · 사고개요 수기작성</small></header><main>
<div class="card"><h2>기본정보</h2><h3>작성자</h3><input id="writer" class="readonly" readonly placeholder="화재조사관 선택"><div id="writerC" class="choices"></div><h3>보고책임자</h3><input id="boss" class="readonly" readonly placeholder="보고책임자 선택"><div id="bossC" class="choices"></div><div class="grid"><label>접수시간<input id="recv" type="time" step="1"></label><label>발생일<input id="date" type="date"></label></div></div>
<div class="card"><h2>1. 발생개요</h2><div class="grid"><label>종료상태<select id="status"><option>화재완진</option><option>자체진화</option><option>화재진압 중</option></select></label><label>종료시간<input id="end" type="time"></label></div><h3>주소</h3><label>읍·면<select id="town" onchange="riButtons()"><option value="">선택</option><option>삼례읍</option><option>봉동읍</option><option>용진읍</option><option>상관면</option><option>이서면</option><option>소양면</option><option>구이면</option><option>고산면</option><option>비봉면</option><option>운주면</option><option>화산면</option><option>동상면</option><option>경천면</option></select></label><label>리<input id="ri" class="readonly" readonly placeholder="읍·면 선택 후 클릭"></label><div id="riBox" class="box"><div id="riC" class="choices"></div></div><label>지번<input id="jibun" class="readonly" readonly onclick="toggle('jibunPad')" placeholder="눌러서 입력"></label><div id="jibunPad" class="box"><div class="keypad"><button class="key" onclick="jk('1')">1</button><button class="key" onclick="jk('2')">2</button><button class="key" onclick="jk('3')">3</button><button class="key" onclick="jk('산 ')">산</button><button class="key" onclick="jk('4')">4</button><button class="key" onclick="jk('5')">5</button><button class="key" onclick="jk('6')">6</button><button class="key" onclick="jk('-')">-</button><button class="key" onclick="jk('7')">7</button><button class="key" onclick="jk('8')">8</button><button class="key" onclick="jk('9')">9</button><button class="key danger" onclick="back('jibun')">←</button><button class="key" onclick="jk('0')">0</button><button class="key danger" onclick="clearV('jibun')">전체삭제</button><button class="key wide done" onclick="hide('jibunPad')">입력완료</button></div></div><label>도로명주소(선택)<input id="road" placeholder="알고 있으면 직접 입력"></label><div class="grid"><label>대상<input id="target" placeholder="예: 단독주택 / 공장 / 창고"></label><label>선착대<select id="first"><option value="">선택</option><option>봉동119안전센터</option><option>소양지역대</option><option>삼례119안전센터</option><option>고산119안전센터</option><option>운주지역대</option><option>화산지역대</option><option>혁신119안전센터</option><option>구이119안전센터</option><option>상관지역대</option></select></label></div><div class="grid"><label>선착대 거리 km<input id="firstKm" class="readonly" readonly onclick="toggle('firstPad')" placeholder="눌러서 입력"></label><div id="firstPad" class="box"></div><label>본서 거리 km<input id="hqKm" class="readonly" readonly onclick="toggle('hqPad')" placeholder="눌러서 입력"></label><div id="hqPad" class="box"></div></div><h3>건축물 구조</h3><input id="structureType" class="readonly" readonly placeholder="구조 선택"><div id="structureC" class="choices"></div><h3>지붕</h3><input id="roofType" class="readonly" readonly placeholder="지붕 선택"><div id="roofC" class="choices"></div><div class="grid"><label>지상층수<div class="step"><input id="groundFloors" type="number" value="1" min="0"><button onclick="step('groundFloors',-1)">−</button><button onclick="step('groundFloors',1)">＋</button></div></label><label>지하층수<div class="step"><input id="underFloors" type="number" value="0" min="0"><button onclick="step('underFloors',-1)">−</button><button onclick="step('underFloors',1)">＋</button></div></label></div><label>연면적 ㎡<input id="area" class="readonly" readonly onclick="toggle('areaPad')" placeholder="눌러서 입력"></label><div id="areaPad" class="box"></div><label>보고서용 구조 문장<input id="structure" placeholder="자동작성 후 직접 수정 가능"></label><button class="btn blue" onclick="composeStructure()">구조 문장 다시 만들기</button><div class="hint">건축물대장·주소 자동조회 등 외부 조회 기능은 사용하지 않습니다.</div></div>
<div class="card core"><span class="badge">앱 핵심</span><h2>2. 사고개요</h2><div class="hint">사고개요는 현장에서 확인한 내용을 직접 작성합니다.</div><label>사고개요<textarea id="summary" placeholder="현장에서 확인한 사실을 보고서 문장으로 직접 입력"></textarea></label><label>원인<input id="cause" value="조사 중" placeholder="예: 부주의 / 전기적 요인 / 조사 중"></label><div class="hint">AI 정리·음성입력·자동 원인추출 없이 입력한 내용 그대로 보고서에 반영됩니다.</div></div>
<div class="card"><h2>3. 피해상황</h2><div class="grid"><label>인명피해<select id="human"><option>피해 없음</option><option>있음</option></select></label><label>인명피해 상세<input id="humanDetail"></label><label>부동산 피해(천원)<input id="real" type="number" value="0"></label><label>동산 피해(천원)<input id="move" type="number" value="0"></label></div><label>부동산 피해내용<input id="realDetail"></label><label>동산 피해내용<input id="moveDetail"></label></div>
<div class="card"><h2>4. 동원상황</h2><div class="grid"><label>소방 명<input id="pFire" type="number" value="0"></label><label>경찰 명<input id="pPolice" type="number" value="0"></label><label>유관기관 명<input id="pAgency" type="number" value="0"></label><label>의소대 명<input id="pVolunteer" type="number" value="0"></label><label>기타인원 합계<input id="pOtherN" type="number" value="0"></label><label>기타인원 내용<input id="pOther"></label><label>장비 총계 대<input id="vehicleN" type="number" value="0"></label></div><label>장비 세부<input id="vehicles"></label></div>
<div class="card"><h2>5. 조치사항</h2><textarea id="actions" placeholder="12:35:59 신고접수 및 출동지령&#10;12:42 선착대 현장도착&#10;12:52 초진&#10;13:07 완진"></textarea></div><div class="card"><h2>6. 그 밖의 사항</h2><label>보험<select id="insurance"><option>미가입</option><option>가입</option></select></label><label>보험 상세<input id="insuranceDetail"></label><label>특이사항<textarea id="special"></textarea></label></div><div class="card"><button class="btn gray" onclick="saveLocal()">기기 임시저장</button> <button id="sheetBtn" class="btn green" onclick="saveSheet()">☁ Google Sheet 저장</button> <button class="btn red" onclick="render()">보고서 미리보기</button><div id="saveStatus" class="status"></div></div><div class="card"><h2>보고서 미리보기</h2><div id="preview" class="preview">입력 후 보고서 미리보기를 누르세요.</div></div>
</main><script>
const API_URL='https://script.google.com/macros/s/AKfycbwuMePzT5oDabWeh216B0szP87G29MLcZSad_cU2iGnYSStEtob7UVs4SecWLr8Y8eZWw/exec',$=x=>document.getElementById(x),v=x=>$(x)?.value||'',n=x=>Number(v(x)||0);
const WRITERS=['소방위 성상옥','소방위 박기환','소방위 이원재','소방장 소범준','소방교 오경수','소방장 곽보국'],BOSSES=['소방령 조계선','소방경 유성훈','소방경 이종삼','소방경 김종래'],STRUCTURES=['철근콘크리트조','철골조','경량철골조','조립식패널조','시멘트벽돌조','시멘트블록조','목조','황토벽돌조','컨테이너','기타'],ROOFS=['슬라브','칼라강판','샌드위치패널','기와','스레이트','징크','기타'];
const RI={'삼례읍':['구와리','삼례리','석전리','수계리','신금리','신탁리','어전리','하리','해전리','후정리'],'봉동읍':['고천리','구만리','구미리','구암리','낙평리','둔산리','성덕리','신성리','용암리','율소리','은하리','장구리','장기리','제내리'],'용진읍':['간중리','구억리','상삼리','상운리','신지리','용흥리','운곡리'],'상관면':['마치리','신리','용암리','의암리','죽림리'],'이서면':['갈산리','금계리','금평리','남계리','반교리','상개리','용서리','은교리','이문리','이성리'],'소양면':['대흥리','명덕리','신교리','신원리','신촌리','죽절리','해월리','화심리','황운리'],'구이면':['계곡리','광곡리','덕천리','두현리','백여리','안덕리','원기리','평촌리','항가리'],'고산면':['남봉리','삼기리','서봉리','성재리','소향리','양야리','어우리','오산리','율곡리','읍내리','화정리'],'비봉면':['내월리','대치리','백도리','봉산리','소농리','수선리','이전리'],'운주면':['고당리','구제리','금당리','산북리','완창리','장선리'],'화산면':['성북리','승치리','와룡리','우월리','운곡리','운산리','운제리','종리','춘산리','화월리','화평리'],'동상면':['대아리','사봉리','수만리','신월리'],'경천면':['가천리','경천리','용복리']};
function choices(id,items,target,cb){let b=$(id);b.innerHTML='';items.forEach(x=>{let q=document.createElement('button');q.type='button';q.className='choice';q.textContent=x;q.onclick=()=>{vset(target,x);[...b.children].forEach(z=>z.classList.toggle('on',z.textContent===x));cb&&cb()};b.appendChild(q)})}function vset(id,x){$(id).value=x}function riButtons(){vset('ri','');let b=$('riC');b.innerHTML='';(RI[v('town')]||[]).forEach(x=>{let q=document.createElement('button');q.type='button';q.className='choice';q.textContent=x;q.onclick=()=>{vset('ri',x);[...b.children].forEach(z=>z.classList.toggle('on',z.textContent===x))};b.appendChild(q)});$('riBox').classList.toggle('show',!!v('town'))}
function hide(id){$(id).classList.remove('show')}function toggle(id){document.querySelectorAll('.box.show').forEach(x=>{if(x.id!==id&&x.id!=='riBox')x.classList.remove('show')});$(id).classList.toggle('show')}function jk(x){let e=$('jibun');if(x==='산 '&&!e.value){e.value=x;return}if(x==='-'&&(!e.value||e.value.endsWith('-')||e.value.endsWith(' ')))return;e.value+=x}function back(id){$(id).value=v(id).slice(0,-1);if(id==='area')composeStructure()}function clearV(id){vset(id,'');if(id==='area')composeStructure()}
function numKey(id,k){let e=$(id);if(k==='.'&&!e.value.includes('.'))e.value=e.value?e.value+'.':'0.';else if(k!=='.')e.value+=k;if(id==='area')composeStructure()}function makePad(box,id){let g=document.createElement('div');g.className='keypad';['1','2','3','4','5','6','7','8','9','.','0'].forEach(k=>{let b=document.createElement('button');b.className='key';b.textContent=k;b.onclick=()=>numKey(id,k);g.appendChild(b)});let bk=document.createElement('button');bk.className='key danger';bk.textContent='←';bk.onclick=()=>back(id);g.appendChild(bk);let cl=document.createElement('button');cl.className='key wide danger';cl.textContent='전체삭제';cl.onclick=()=>clearV(id);g.appendChild(cl);let dn=document.createElement('button');dn.className='key wide done';dn.textContent='입력완료';dn.onclick=()=>hide(box);g.appendChild(dn);$(box).appendChild(g)}
function step(id,a){vset(id,Math.max(0,n(id)+a));composeStructure()}function composeStructure(){let p=[];if(v('structureType'))p.push(v('structureType'));if(v('roofType'))p.push(v('roofType')+' 지붕');let f=[];if(n('underFloors'))f.push('지하 '+n('underFloors')+'층');if(n('groundFloors'))f.push('지상 '+n('groundFloors')+'층');if(f.length)p.push(f.join(' / '));if(n('area'))p.push('연면적 '+n('area').toLocaleString('ko-KR')+'㎡');vset('structure',p.join(', '))}
function address(){return v('road')?`${v('road')}(${v('ri')} ${v('jibun')})`:`완주군 ${v('town')} ${v('ri')} ${v('jibun')}`}function timeline(){return v('actions').split('\n').filter(Boolean).map(x=>{let m=x.trim().match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s*(.*)$/);return m?{time:m[1],text:m[2]}:{time:'',text:x.trim()}})}
function collect(){return{reportId:localStorage.getItem('wanjuReportId')||'',status:'작성중',date:v('date'),recv:v('recv'),end:v('end'),endStatus:v('status'),writer:v('writer'),boss:v('boss'),town:v('town'),ri:v('ri'),jibun:v('jibun'),road:v('road'),first:v('first'),firstKm:v('firstKm'),hqKm:v('hqKm'),target:v('target'),titleTarget:v('target'),structure:v('structure'),cause:v('cause'),raw:v('summary'),summary:v('summary'),human:v('human'),humanDetail:v('humanDetail'),real:n('real'),move:n('move'),realDetail:v('realDetail'),moveDetail:v('moveDetail'),pFire:n('pFire'),pPolice:n('pPolice'),pAgency:n('pAgency'),pVolunteer:n('pVolunteer'),pOtherN:n('pOtherN'),pOther:v('pOther'),vehicleN:n('vehicleN'),vehicles:v('vehicles'),timeline:timeline(),insurance:v('insurance'),insuranceDetail:v('insuranceDetail'),special:v('special'),finalReportTime:''}}
async function saveSheet(){let b=$('sheetBtn'),s=$('saveStatus');b.disabled=true;s.textContent='Google Sheet 저장 중...';try{let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveReport',report:collect()})}),d=await r.json();if(!d.ok)throw Error(d.message||'저장 실패');localStorage.setItem('wanjuReportId',d.reportId);saveLocal(false);s.textContent='✓ 저장 완료 · '+d.reportId}catch(e){s.textContent='저장 실패: '+e.message}finally{b.disabled=false}}
function render(){let total=n('real')+n('move'),people=n('pFire')+n('pPolice')+n('pAgency')+n('pVolunteer')+n('pOtherN');$('preview').textContent=`완주군 ${v('town')} ${v('ri')} ${v('target')} 화재\n\n수신: 전북특별도지사 / 참조: 119종합상황실장\n발신: 완주소방서장 / 발신지: 완주소방서 현장대응단\n작성자: ${v('writer')} / 보고책임자: ${v('boss')} / 접수시간: ${v('recv')}\n\n1. 발생개요\n 가. 일시: ${v('date')} ${v('recv')}(접수) ~ ${v('end')}(${v('status')})\n   ※ 선착대 ${v('first')} ${v('firstKm')}km, 본서 ${v('hqKm')}km\n 나. 장소: ${address()}\n 다. 구조: ${v('structure')}\n 라. 대상: ${v('target')}\n 마. 원인: ${v('cause')}\n 바. 사고개요: ${v('summary')}\n\n2. 피해상황\n 가. 인명피해: ${v('human')} ${v('humanDetail')}\n 나. 재산피해: ${total.toLocaleString()}천원(부동산 ${n('real').toLocaleString()}천원, 동산 ${n('move').toLocaleString()}천원)\n\n3. 동원상황\n 가. 인원: ${people}명(소방 ${n('pFire')}, 경찰 ${n('pPolice')}, 유관기관 ${n('pAgency')}, 의소대 ${n('pVolunteer')})\n 나. 장비: ${n('vehicleN')}대(${v('vehicles')})\n\n4. 조치사항\n${v('actions')}\n\n5. 그 밖의 사항\n ○ 보험가입: ${v('insurance')}${v('insuranceDetail')?' - '+v('insuranceDetail'):''}\n ○ 특이사항: ${v('special')||'없음'}`}
function saveLocal(show=true){let d={};document.querySelectorAll('[id]').forEach(e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.tagName))d[e.id]=e.value});localStorage.setItem('wanjuFireReportV2',JSON.stringify(d));if(show)alert('현재 기기에 임시저장했습니다.')}function restore(){let s=localStorage.getItem('wanjuFireReportV2')||localStorage.getItem('wanjuFireReportV1');if(!s)return;try{let d=JSON.parse(s);Object.entries(d).forEach(([k,x])=>{$(k)&&( $(k).value=x)});riButtons();if(d.ri)vset('ri',d.ri)}catch(e){}}
