name: Apply V2.7 actions

on:
  push:
    paths:
      - '.github/workflows/apply-v27-actions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V2.7 personnel keypad and actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('완주소방서 화재상황보고 V2.6','완주소방서 화재상황보고 V2.7')
          s=s.replace('현장 클릭 입력 중심 · 피해액 자동계산 · 동원상황 차량클릭','현장 클릭 입력 중심 · 동원인원 숫자키패드 · 조치사항 빠른선택')

          css=r'''.actionQuickGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.actionQuick{min-height:46px;border:1px solid #c7cdd4;background:#fff;border-radius:10px;font-weight:900;padding:8px;cursor:pointer}.actionQuick.active{background:#dcfce7;border-color:#86efac;color:#166534}.actionRows{display:flex;flex-direction:column;gap:9px;margin-top:12px}.actionRow{border:1px solid #e5e7eb;background:#fafafa;border-radius:12px;padding:9px}.actionLine{display:grid;grid-template-columns:108px 1fr 52px;gap:7px;align-items:start}.actionTime{font-weight:900;text-align:center;background:#fff}.actionText{min-width:0}.actionDel{height:43px;border:0;border-radius:9px;background:#fff1f2;color:#be123c;font-weight:900}.actionPad{display:none;margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.actionPad.show{display:block}.actionPadGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.actionPadGrid button{height:43px;border:1px solid #d1d5db;background:#fff;border-radius:9px;font-size:16px;font-weight:900}.actionPadGrid .done{background:#111827;color:#fff}.actionHelp{margin-top:8px;font-size:12px;color:#6b7280}.personGrid .box{grid-column:1/-1}@media(max-width:650px){.actionQuickGrid{grid-template-columns:repeat(2,1fr)}.actionLine{grid-template-columns:92px 1fr 48px}}'''
          if '.actionQuickGrid{' not in s:
              s=s.replace('</style>',css+'</style>')

          old_person='''<div class="personGrid"><label>소방 명<input id="pFire" type="number" min="0" value="0"></label><label>경찰 명<input id="pPolice" type="number" min="0" value="0"></label><label>유관기관 명<input id="pAgency" type="number" min="0" value="0"></label><label>의소대 명<input id="pVolunteer" type="number" min="0" value="0"></label><label>기타 명<input id="pOtherN" type="number" min="0" value="0"></label></div>'''
          new_person='''<div class="personGrid"><label>소방 명<input id="pFire" class="readonly" readonly inputmode="none" value="0" onclick="toggle('pFirePad')"><div id="pFirePad" class="box"></div></label><label>경찰 명<input id="pPolice" class="readonly" readonly inputmode="none" value="0" onclick="toggle('pPolicePad')"><div id="pPolicePad" class="box"></div></label><label>유관기관 명<input id="pAgency" class="readonly" readonly inputmode="none" value="0" onclick="toggle('pAgencyPad')"><div id="pAgencyPad" class="box"></div></label><label>의소대 명<input id="pVolunteer" class="readonly" readonly inputmode="none" value="0" onclick="toggle('pVolunteerPad')"><div id="pVolunteerPad" class="box"></div></label><label>기타 명<input id="pOtherN" class="readonly" readonly inputmode="none" value="0" onclick="toggle('pOtherNPad')"><div id="pOtherNPad" class="box"></div></label></div>'''
          if old_person not in s: raise SystemExit('person block not found')
          s=s.replace(old_person,new_person,1)

          old_actions='''<div class="card"><h2>5. 조치사항</h2><textarea id="actions" placeholder="12:35:59 신고접수 및 출동지령&#10;12:42 선착대 현장도착&#10;12:52 초진&#10;13:07 완진"></textarea></div>'''
          new_actions='''<div class="card"><h2>5. 조치사항</h2><div class="hint">2025년 화재상황보고서에서 반복된 조치사항을 중심으로 구성했습니다. 항목을 누르면 아래에 한 줄씩 추가됩니다.</div><h3>자주 사용하는 조치</h3><div id="actionMainButtons" class="actionQuickGrid"></div><h3>특수·사후조사 조치</h3><div id="actionSpecialButtons" class="actionQuickGrid"></div><div class="actionHelp">시간 칸을 누르면 앱 숫자키패드가 열립니다. 문구는 추가된 뒤 직접 수정할 수 있습니다.</div><div id="actionRows" class="actionRows"></div><button type="button" class="btn gray" onclick="addCustomAction()">＋ 기타 조치 직접추가</button><input id="actionsJson" class="hiddenInput" value="[]"><textarea id="actions" class="hiddenInput"></textarea></div>'''
          if old_actions not in s: raise SystemExit('actions block not found')
          s=s.replace(old_actions,new_actions,1)

          action_js=r'''const ACTION_MAIN=[{id:'dispatch',label:'신고접수·출동',text:'신고접수 및 출동',recv:true,once:true},{id:'first',label:'선착대 도착',text:'선착대 현장도착',once:true},{id:'command',label:'완주지휘 도착',text:'완주지휘 현장도착',once:true},{id:'later',label:'후착대 도착',text:'후착대 현장도착',once:false},{id:'firstout',label:'초진',text:'초진',once:true},{id:'complete',label:'완진',text:'완진',once:true},{id:'withdraw',label:'철수',text:'철수',once:true}];const ACTION_SPECIAL=[{id:'self',label:'완진(자체진화)',text:'완진(자체진화)',once:true},{id:'status',label:'상황전파',text:'상황전파',once:false},{id:'commandDeclare',label:'지휘권 선언',text:'완주지휘 현장도착 및 지휘권 선언',once:true},{id:'inspect',label:'화재감식 후 철수',text:'화재감식 후 철수',once:true},{id:'investigate',label:'화재조사 후 귀소',text:'완주지휘 화재조사 실시후 귀소',once:true},{id:'mop',label:'잔화정리 후 철수',text:'잔화정리 후 철수',once:true},{id:'excavator',label:'굴삭기 도착',text:'굴삭기 현장도착',once:false},{id:'safety',label:'안전조치',text:'화재현장 안전조치',once:false},{id:'police',label:'경찰 인계',text:'완진 및 경찰 인계',once:true},{id:'after',label:'사후조사',text:'완주지휘 현장도착-사후조사',once:true}];let actionState=[];function allActionDefs(){return [...ACTION_MAIN,...ACTION_SPECIAL]}function initActionButtons(){makeActionButtonSet('actionMainButtons',ACTION_MAIN);makeActionButtonSet('actionSpecialButtons',ACTION_SPECIAL)}function makeActionButtonSet(id,defs){let box=$(id);box.innerHTML='';defs.forEach(d=>{let b=document.createElement('button');b.type='button';b.className='actionQuick';b.id='aq_'+d.id;b.textContent=d.label;b.addEventListener('click',()=>addActionTemplate(d));box.appendChild(b)})}function addActionTemplate(d){if(d.once){let idx=actionState.findIndex(x=>x.type===d.id);if(idx>=0){let e=$('actionTime_'+idx);e&&e.focus();return}}actionState.push({type:d.id,time:d.recv?v('recv'):'',text:d.text});renderActionRows();syncActionsText()}function addCustomAction(){actionState.push({type:'custom',time:'',text:''});renderActionRows();syncActionsText();let i=actionState.length-1;$('actionText_'+i)?.focus()}function deleteAction(i){actionState.splice(i,1);renderActionRows();syncActionsText()}function actionTimeDigits(t){return String(t||'').replace(/\D/g,'').slice(0,6)}function actionTimeFormat(d){d=String(d||'').slice(0,6);if(d.length<=2)return d;if(d.length<=4)return d.slice(0,2)+':'+d.slice(2);return d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4)}function actionTimeValid(t){if(!t)return true;let p=t.split(':').map(Number);if(p.length<2)return false;return p[0]>=0&&p[0]<=23&&p[1]>=0&&p[1]<=59&&(p.length<3||(p[2]>=0&&p[2]<=59))}function actionDigit(i,d){let raw=actionTimeDigits(actionState[i].time);if(raw.length>=6)return;raw+=d;actionState[i].time=actionTimeFormat(raw);let e=$('actionTime_'+i);if(e)e.value=actionState[i].time;syncActionsText()}function actionBack(i){let raw=actionTimeDigits(actionState[i].time).slice(0,-1);actionState[i].time=actionTimeFormat(raw);let e=$('actionTime_'+i);if(e)e.value=actionState[i].time;syncActionsText()}function actionClear(i){actionState[i].time='';let e=$('actionTime_'+i);if(e)e.value='';syncActionsText()}function actionDone(i){if(!actionTimeValid(actionState[i].time)){alert('시간을 HHMM 또는 HHMMSS 형식으로 입력해주세요.');return}$('actionPad_'+i)?.classList.remove('show')}function toggleActionPad(i){document.querySelectorAll('.actionPad.show').forEach(x=>{if(x.id!=='actionPad_'+i)x.classList.remove('show')});$('actionPad_'+i)?.classList.toggle('show')}function updateActionText(i,val){actionState[i].text=val;syncActionsText()}function renderActionRows(){let box=$('actionRows');box.innerHTML='';actionState.forEach((a,i)=>{let row=document.createElement('div');row.className='actionRow';let line=document.createElement('div');line.className='actionLine';let tm=document.createElement('input');tm.id='actionTime_'+i;tm.className='actionTime readonly';tm.readOnly=true;tm.inputMode='none';tm.placeholder='시간';tm.value=a.time||'';tm.addEventListener('click',()=>toggleActionPad(i));let tx=document.createElement('input');tx.id='actionText_'+i;tx.className='actionText';tx.value=a.text||'';tx.placeholder='조치내용';tx.addEventListener('input',e=>updateActionText(i,e.target.value));let del=document.createElement('button');del.type='button';del.className='actionDel';del.textContent='삭제';del.addEventListener('click',()=>deleteAction(i));line.append(tm,tx,del);let pad=document.createElement('div');pad.id='actionPad_'+i;pad.className='actionPad';let g=document.createElement('div');g.className='actionPadGrid';['1','2','3','4','5','6','7','8','9','0'].forEach(k=>{let b=document.createElement('button');b.type='button';b.textContent=k;b.addEventListener('click',()=>actionDigit(i,k));g.appendChild(b)});let back=document.createElement('button');back.type='button';back.textContent='←';back.addEventListener('click',()=>actionBack(i));g.appendChild(back);let clear=document.createElement('button');clear.type='button';clear.textContent='전체삭제';clear.addEventListener('click',()=>actionClear(i));g.appendChild(clear);let done=document.createElement('button');done.type='button';done.className='done';done.textContent='입력완료';done.addEventListener('click',()=>actionDone(i));g.appendChild(done);pad.appendChild(g);row.append(line,pad);box.appendChild(row)});updateActionButtonState()}function updateActionButtonState(){allActionDefs().forEach(d=>{$('aq_'+d.id)?.classList.toggle('active',actionState.some(x=>x.type===d.id))})}function syncActionsText(){vset('actionsJson',JSON.stringify(actionState));let lines=actionState.filter(x=>(x.text||'').trim()).map(x=>(x.time?x.time+' ':'')+(x.text||'').trim());vset('actions',lines.join('\n'));updateActionButtonState()}function loadActionState(){let parsed=[];try{parsed=JSON.parse(v('actionsJson')||'[]')||[]}catch(e){parsed=[]}if(!Array.isArray(parsed))parsed=[];if(!parsed.length&&v('actions').trim()){parsed=v('actions').split('\n').filter(Boolean).map(line=>{let t=line.trim().replace(/^[○◦•-]\s*/,'');let m=t.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s*(.*)$/);return{type:'custom',time:m?m[1]:'',text:m?m[2]:t}})}actionState=parsed;renderActionRows();syncActionsText()}'''
          marker='function address(){'
          if 'const ACTION_MAIN=' not in s:
              if marker not in s: raise SystemExit('address marker not found')
              s=s.replace(marker,action_js+marker,1)

          old_make="makePad('firstPad','firstKm');makePad('hqPad','hqKm');makePad('areaPad','area');"
          new_make="makePad('firstPad','firstKm');makePad('hqPad','hqKm');makePad('areaPad','area');makePad('pFirePad','pFire',false);makePad('pPolicePad','pPolice',false);makePad('pAgencyPad','pAgency',false);makePad('pVolunteerPad','pVolunteer',false);makePad('pOtherNPad','pOtherN',false);"
          if old_make not in s: raise SystemExit('makePad marker not found')
          s=s.replace(old_make,new_make,1)

          old_init="initDamageCalculator();makeVehicleGrid('vehicleMainGrid',VEHICLE_MAIN);makeVehicleGrid('vehicleSpecialGrid',VEHICLE_SPECIAL);restore();loadVehicleState();syncDamageCards();"
          new_init="initDamageCalculator();makeVehicleGrid('vehicleMainGrid',VEHICLE_MAIN);makeVehicleGrid('vehicleSpecialGrid',VEHICLE_SPECIAL);initActionButtons();restore();loadVehicleState();loadActionState();syncDamageCards();"
          if old_init not in s: raise SystemExit('init marker not found')
          s=s.replace(old_init,new_init,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V2.7
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "V2.7 인원 숫자키패드 및 조치사항 빠른선택" || exit 0
          git push
